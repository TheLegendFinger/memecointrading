# memebot configuration - copy to config.yaml and edit.
# The menu creates it for you on the first run.
#
# This bot trades real money. Every number here is deliberately conservative
# and sized for a SMALL wallet (~$50-200): real fills cost more than you expect,
# failed swaps still cost fees, and there is no undo. Raise limits slowly, and
# only after watching it work.
#
# Anything you leave out uses the built-in default - run
# `python -m memebot config` to see the full effective configuration.

poll_interval_seconds: 45        # fewer API calls; memecoin moves last minutes
state_db: data/memebot.sqlite3
log_file: logs/memebot.log
log_level: INFO

data:
  chain: solana
  # Each term is one request returning ~30 pairs, de-duplicated by token
  # afterwards - more terms is a genuinely wider net, not the same coins twice.
  # Four terms only sees ~70 coins a cycle, which is not enough for anything to
  # clear the filters.
  search_terms: ["SOL", "WSOL", "USDC", "pump", "bonk", "wif", "cat", "dog", "inu", "pepe",
                 "moon", "elon", "trump", "ai", "meme", "coin", "baby", "gold", "chad", "wojak"]
  use_boosted_feed: true
  use_token_profiles: true
  # Search finds coins by NAME. These find them by what is actually being
  # traded, which is what stops one fashionable ticker filling a whole scan.
  use_trending_pools: true       # GeckoTerminal trending
  use_top_pools: true            # busiest pools by 24h volume
  use_new_pools: false           # minutes old; the age filter eats most of it
  # How many coins sharing a ticker family (STONK, STONKS, STONK2...) may be
  # considered in one cycle. 0 turns the cap off.
  max_per_symbol: 2
  max_candidates: 400            # pairs scored per cycle
  feed_limit: 120                # how deep to read each feed before batching

filters:
  # Stricter than paper. With real money, being able to EXIT matters more
  # than finding more candidates.
  min_liquidity_usd: 30000       # you must be able to sell what you buy
  max_liquidity_usd: 5000000     # above this it is not a memecoin trade
  min_volume_h1_usd: 25000
  min_volume_h24_usd: 150000
  min_age_minutes: 30            # skip the first, most manipulated minutes
  max_age_minutes: 20160
  max_fdv_usd: 30000000
  min_trades_h1: 60
  min_buy_ratio_h1: 0.48
  min_liquidity_to_fdv: 0.02     # rug guard, tighter than paper
  max_price_change_h1_pct: 200   # do not buy the top of a vertical move
  max_price_change_h24_pct: 800
  blacklist_mints: []
  blacklist_symbols: []

safety:
  # Checks on the token itself, read from the chain before it is bought.
  # The market data everything else uses cannot see either of these.
  enabled: true
  require_mint_authority_revoked: true   # else they can print more supply
  require_freeze_authority_revoked: true # else they can stop you selling
  # Share of supply, ignoring the pool's own account. 0 turns a check off.
  max_single_holder_pct: 0.15
  max_top10_holder_pct: 0.40
  # If the chain cannot be read, buy anyway? No: unchecked is treated as failed.
  allow_unverified: false
  cache_seconds: 600

strategy:
  name: momentum
  # The main dial. Roughly what the score means:
  #   0.90+  vertical - already up 40%+ on the hour, volume 4x its average
  #   0.65   clearly running: +3-4% on 5m, +18% on 1h, 3x volume, 2:1 buys
  #   0.45   decent: moving up, hotter than usual, more buyers than sellers
  #   0.30   warming up
  #   <0.10  flat, drifting or falling
  min_score: 0.55
  max_new_positions_per_cycle: 1 # one entry per cycle, no piling in

risk:
  # There is no bankroll setting. The wallet's balance is read from the chain at
  # the start of every cycle and that is what gets sized against - send more SOL
  # in and it trades bigger, take some out and it trades smaller.

  max_open_positions: 3
  position_size_pct: 0.20        # 20% of a small bankroll per position
  min_position_usd: 5            # below this a swap's fees eat the trade
  max_position_usd: 25           # hard ceiling per position - raise slowly
  max_position_pct_of_liquidity: 0.002   # never be more than 0.2% of the pool
  cash_reserve_pct: 0.10

  stop_loss_pct: 0.25            # wider than paper: real fills need room
  take_profit_pct: 0.50
  trailing_stop_pct: 0.20
  trailing_arm_profit_pct: 0.25
  max_hold_minutes: 360          # 6 hours
  liquidity_drain_pct: 0.4       # exit earlier than paper on a draining pool
  stale_price_exit_minutes: 20

  max_daily_loss_pct: 0.20       # stop trading for the day after -20%
  max_drawdown_pct: 0.35         # stop entirely after -35% from the peak
  cooldown_minutes_after_loss: 45
  reentry_cooldown_minutes: 180

execution:
  slippage_bps: 200              # 2%: memecoin swaps revert below this
  fee_bps: 25
  # A higher priority fee lands more transactions when the network is busy.
  # 0.0003 SOL-ish per swap at 300k microlamports.
  priority_fee_microlamports: 300000
  compute_unit_limit: 300000
  max_tx_retries: 3
  confirm_timeout_seconds: 90
  # SOL held back for fees and token-account rent, never traded.
  sol_fee_reserve: 0.025
  # Trade against SOL. Change to the USDC mint to hold stables between trades.
  quote_mint: So11111111111111111111111111111111111111112
  rpc_url: https://api.mainnet-beta.solana.com
