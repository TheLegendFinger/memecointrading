[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memebot"
version = "1.6.0"
description = "A Solana memecoin trading bot - real swaps through Jupiter."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
live = ["solders>=0.21", "base58>=2.1"]
dev = ["pytest>=7.4"]

[project.scripts]
memebot = "memebot.cli:main"

[tool.setuptools.packages.find]
include = ["memebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
