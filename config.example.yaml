# memebot configuration - copy to config.yaml and edit.
#   python -m memebot run --config config.yaml
#
# Every value here is optional; anything omitted uses the built-in default
# (see `python -m memebot config` for the full effective configuration).

# "paper" simulates fills locally. "live" signs and broadcasts real swaps and
# additionally requires LIVE_TRADING_CONFIRM=I_UNDERSTAND_THE_RISK in the env.
mode: paper

poll_interval_seconds: 30
state_db: data/memebot.sqlite3
log_file: logs/memebot.log
log_level: INFO
dry_run: false          # evaluate and log decisions, never send an order

data:
  chain: solana
  # DexScreener search terms used to build the candidate universe each cycle.
  search_terms: ["SOL", "WSOL", "pump", "bonk"]
  use_boosted_feed: true      # also pull the DexScreener boost leaderboard
  max_candidates: 120
  rate_limit_per_minute: 120  # DexScreener allows ~300/min; stay well under
  cache_ttl_seconds: 5

# Hard safety gates. A pair must clear all of these before it is even scored.
filters:
  min_liquidity_usd: 25000        # must be deep enough to exit
  max_liquidity_usd: 5000000
  min_volume_h1_usd: 20000
  min_volume_h24_usd: 100000
  min_age_minutes: 20             # skip the chaotic first minutes
  max_age_minutes: 20160          # two weeks
  max_fdv_usd: 50000000
  min_trades_h1: 60
  min_buy_ratio_h1: 0.45
  min_liquidity_to_fdv: 0.015     # rug guard: thin float behind a big valuation
  max_price_change_h1_pct: 300    # do not chase something already vertical
  max_price_change_h24_pct: 1500
  blacklist_mints: []
  blacklist_symbols: []

strategy:
  name: momentum
  min_score: 0.55                 # 0..1 composite; raise to trade less, better
  weight_momentum_m5: 0.30
  weight_momentum_h1: 0.25
  weight_volume_surge: 0.20
  weight_buy_pressure: 0.15
  weight_liquidity: 0.10
  exit_momentum_m5_pct: -8.0      # bail when the 5m candle reverses this hard
  max_new_positions_per_cycle: 2

risk:
  starting_cash_usd: 1000         # paper bankroll (ignored in live mode)
  max_open_positions: 5
  position_size_pct: 0.08         # 8% of equity per entry
  min_position_usd: 10
  max_position_usd: 250
  max_position_pct_of_liquidity: 0.005   # never be more than 0.5% of the pool
  cash_reserve_pct: 0.05

  stop_loss_pct: 0.20
  take_profit_pct: 0.60
  trailing_stop_pct: 0.25
  trailing_arm_profit_pct: 0.25   # trail only arms once up 25%
  max_hold_minutes: 720
  liquidity_drain_pct: 0.5        # exit if the pool halves while we are in it
  stale_price_exit_minutes: 30

  max_daily_loss_pct: 0.15        # circuit breaker for the day
  max_drawdown_pct: 0.35          # circuit breaker from peak equity
  cooldown_minutes_after_loss: 30
  reentry_cooldown_minutes: 120

execution:
  slippage_bps: 150               # 1.5% tolerance sent to the aggregator
  fee_bps: 25                     # pool fee assumed when simulating
  network_fee_usd: 0.05
  priority_fee_usd: 0.35
  paper_base_slippage_bps: 30
  paper_failure_rate: 0.02        # 2% of simulated swaps fail, like real life
  paper_use_live_quotes: false    # true = route paper fills through Jupiter
  # paper_random_seed: 42         # set for reproducible paper runs

  # Live only:
  rpc_url: https://api.mainnet-beta.solana.com
  priority_fee_microlamports: 200000
  compute_unit_limit: 300000
  confirm_timeout_seconds: 60
  quote_mint: So11111111111111111111111111111111111111112   # trade against SOL
